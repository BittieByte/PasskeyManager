name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/PasskeyManager.Tests -c Release

      - name: Publish
        run: dotnet publish src/PasskeyManager/PasskeyManager.csproj -c Release -o dist

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: PasskeyManager
          path: dist/PasskeyManager.exe
